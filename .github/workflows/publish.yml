name: Publish to npm

on:
  push:
    branches:
      # main = dsh 稳定线适配（发 latest）；alpha = dsh 预发布线适配（发
      # alpha 等 dist-tag）。分支模型与发布规则见 RELEASING.md。
      - main
      - alpha
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'scripts/**'
      - '.github/workflows/publish.yml'
  release:
    types: [published]
  workflow_dispatch:

# 仓库级并发组（不按分支区分）：main 与 alpha 的发布也必须排队——两个分支
# 可能存在同版本号的包，并发发布会双发同一版本，npm 会拒绝第二个、白红一个
# job。不取消进行中的发布：已开始的 npm publish 让它跑完，排队的用最新代码重来。
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # 发布成功后要打 git tag 并创建 GitHub Release
      # npm Trusted Publishing (OIDC): publish without a long-lived token
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 全量历史：publish-gate 靠 git tag 判定「该版本是否已发布归档」，
          # 浅克隆会漏 tag 导致重复发布尝试。
          fetch-depth: 0

      # pnpm is the only toolchain entry point: install / test / version reads
      # all run through pnpm. pnpm 版本取自 package.json 的 packageManager 字段,
      # 与本地保持一致(Corepack 也认这个字段)。
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # setup-node 提供 Node(下面的 `node -e` 与 pnpm 自身都要用)并缓存
      # pnpm store;必须在 action-setup 之后,cache: pnpm 才能找到 store 路径。
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test:ci

      # 状态式门禁：该发什么由 git tag 与 npm 注册表状态决定，与推送形状无关
      # （判定规则见 scripts/publish-gate.mjs 头注释）。版本号落后于 npm 的包
      # 会让整个 job 失败——「改了代码没升版本」从此是红灯而不是静默跳过。
      - name: Plan publish
        id: plan
        run: |
          PLAN=$(node scripts/publish-gate.mjs)
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"

      - name: Publish planned packages
        id: publish
        if: steps.plan.outputs.plan != '[]'
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
        run: |
          PUBLISHED=""
          while IFS= read -r entry; do
            dir="${entry%%@*}"; rest="${entry#*@}"; version="${rest%%@*}"; dist_tag="${rest#*@}"
            echo "Publishing packages/$dir@$version under dist-tag '$dist_tag' ..."
            cd "packages/$dir"
            # `pnpm publish`: OIDC Trusted Publishing happens automatically
            # when id-token: write is set and the package has a trusted
            # publisher configured on npmjs.com. --provenance adds attestation.
            # pnpm 11.0.x 曾在这里抛 404(pnpm/pnpm#11513,已由 #11526 修复),
            # 11.24.0 起 pnpm 自己的发版流程就是走的这条路。
            # --no-git-checks: checkout 出来是 detached HEAD,pnpm 默认的分支
            # 检查会拒绝发布。
            pnpm publish --provenance --access public --no-git-checks --tag "$dist_tag" --registry=https://registry.npmjs.org
            cd ../..
            PUBLISHED="$PUBLISHED $dir@$version"
          done < <(node -e 'for (const p of JSON.parse(process.argv[1])) console.log(`${p.dir}@${p.version}@${p.tag}`)' "$PLAN")
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"

      # 发布成功后归档：git tag（`<目录>-v<版本>`，发布门禁据此幂等跳过）+
      # GitHub Release（说明取该包 CHANGELOG 对应版本小节，README 的 tarball
      # 安装方式由此获得与 npm 一致的版本）。发布中途失败时直接重跑整个 job：
      # 已发布的包被门禁跳过，未完成的继续。
      - name: Create git tags and GitHub releases
        if: steps.publish.outputs.published != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ steps.publish.outputs.published }}
        run: |
          for entry in $PUBLISHED; do
            dir="${entry%%@*}"; rest="${entry#*@}"; version="${rest#*@}"
            tag="$dir-v$version"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists, skipping."
              continue
            fi
            PKG_NAME=$(node -e "console.log(require('./packages/$dir/package.json').name)")
            NOTES=$(node scripts/release-notes.mjs "$dir" "$version")
            gh release create "$tag" --target "$GITHUB_SHA" --title "$PKG_NAME v$version" --notes "$NOTES"
          done

      # dsh 稳定版适配归档：main 流水成功（测试全绿 + 门禁走完）后，按当前
      # dsh 依赖基线打 `dsh-v<版本>` tag（幂等：基线没变则 tag 已存在跳过）。
      # 语义：「该提交 = 对 dsh 此稳定版的已验证适配」，供回退与对照（见
      # RELEASING.md「dsh 适配归档 tag」）。alpha 分支不打——它永远追随
      # dsh 最新的 alpha 线，没有按宿主版本回退的管理需求。基线未变的日常
      # 发布不影响此 tag；基线前进（跟进新稳定版）的首次成功流水自动落
      # 一个新 tag。
      - name: Tag the dsh release baseline
        if: github.ref == 'refs/heads/main'
        run: |
          BASELINE=$(node scripts/dsh-baseline.mjs)
          TAG="dsh-v$BASELINE"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "refs/tags/$TAG$"; then
            echo "$TAG already exists, skipping."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
            echo "Tagged $TAG at $GITHUB_SHA"
          fi
