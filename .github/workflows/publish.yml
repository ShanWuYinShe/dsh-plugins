name: Publish to GitHub Releases

on:
  push:
    branches:
      # main = dsh 稳定线适配（发正式版 Release）；alpha = dsh 预发布线适配
      # （发 prerelease Release）。分支模型与发布规则见 RELEASING.md。
      - main
      - alpha
    paths:
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - 'scripts/**'
      - '.github/workflows/publish.yml'
  # 不监听 release.published：本 workflow 发布成功后自己会 gh release create，
  # 那会再触发一次 release 事件造成空转循环（门禁幂等不会双发，但每次发布
  # 都多跑一轮全量 build+test）。发布只由推送驱动。
  workflow_dispatch:

# 仓库级并发组（不按分支区分）：main 与 alpha 的发布也必须排队——两个分支
# 可能存在同版本号的包，并发发布会双发同一版本，git tag 冲突会让第二个 job
# 红掉。不取消进行中的发布：已开始的发布让它跑完，排队的用最新代码重来。
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      # 发布成功后要打 git tag 并创建 GitHub Release（含 tarball 资产）
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 全量历史：publish-gate 靠 git tag 判定「该版本是否已发布归档」，
          # 浅克隆会漏 tag 导致重复发布尝试。
          fetch-depth: 0

      # bun 是唯一的包管理器入口:install / test / pack 全走 bun。
      # bun 版本取根 package.json 的 packageManager 字段,与本地保持一致。
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # setup-node 只提供 Node(下面的 `node -e` 与 scripts/*.mjs 直接调用)。
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test:ci

      # 状态式门禁：该发什么由 git tag 归档状态决定，与推送形状无关（判定
      # 规则见 scripts/publish-gate.mjs 头注释）。版本号低于已归档版本的包
      # 会让整个 job 失败——「改了代码没升版本」从此是红灯而不是静默跳过。
      - name: Plan publish
        id: plan
        run: |
          PLAN=$(node scripts/publish-gate.mjs)
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"

      # 发布 = 每个待发布包 bun pm pack 出标准 npm tarball（与原 npm registry
      # 产物同格式：lib/、client/、cordis.patch.yml、dsh.host 等字段齐全，
      # dsh 的 plugin add 可直接装 tarball URL），作为 GitHub
      # Release 资产上传。tag `<目录>-v<版本>` 由 gh release create 打在触发
      # 提交上，发布门禁据此幂等跳过；prerelease 布尔取自门禁计划（版本带
      # `-` 即 true）。消费者安装命令见各包 README。
      - name: Pack and publish planned packages
        id: publish
        if: steps.plan.outputs.plan != '[]'
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PUBLISHED=""
          while IFS= read -r entry; do
            dir="${entry%%@*}"; rest="${entry#*@}"; version="${rest%%@*}"; prerelease="${rest#*@}"
            TAG="$dir-v$version"
            echo "Packing packages/$dir@$version → GitHub Release $TAG (prerelease=$prerelease) ..."
            cd "packages/$dir"
            TARBALL=$(bun pm pack --quiet | tail -1)
            if [ ! -f "$TARBALL" ]; then
              echo "bun pm pack 未能产出预期的 tarball（得到: $TARBALL）"
              exit 1
            fi
            PKG_NAME=$(node -e "console.log(require('./package.json').name)")
            cd ../..
            NOTES=$(node scripts/release-notes.mjs "$dir" "$version")
            PRERELEASE_FLAG=""
            [ "$prerelease" = "true" ] && PRERELEASE_FLAG="--prerelease"
            if gh release view "$TAG" >/dev/null 2>&1; then
              # 重跑幂等：Release 已在（上次运行发布步骤中途失败），只补缺失
              # 的资产；资产也在才整体跳过。
              if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$TARBALL"; then
                echo "Release $TAG 与资产均已存在，跳过。"
              else
                gh release upload "$TAG" "packages/$dir/$TARBALL" --clobber
                echo "Release $TAG 已存在，补传资产 $TARBALL。"
              fi
            else
              gh release create "$TAG" "packages/$dir/$TARBALL" --target "$GITHUB_SHA" \
                --title "$PKG_NAME v$version" --notes "$NOTES" $PRERELEASE_FLAG
            fi
            PUBLISHED="$PUBLISHED $dir@$version"
          done < <(node -e 'for (const p of JSON.parse(process.argv[1])) console.log(`${p.dir}@${p.version}@${p.prerelease}`)' "$PLAN")
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"

      # dsh 稳定版适配归档：main 流水成功（测试全绿 + 门禁走完）后，按当前
      # dsh 依赖基线打 `dsh-v<版本>` tag（幂等：基线没变则 tag 已存在跳过）。
      # 语义：「该提交 = 对 dsh 此稳定版的已验证适配」，供回退与对照（见
      # RELEASING.md「dsh 适配归档 tag」）。alpha 分支不打——它永远追随
      # dsh 最新的 alpha 线，没有按宿主版本回退的管理需求。基线未变的日常
      # 发布不影响此 tag；基线前进（跟进新稳定版）的首次成功流水自动落
      # 一个新 tag。
      - name: Tag the dsh release baseline
        if: github.ref == 'refs/heads/main'
        run: |
          BASELINE=$(node scripts/dsh-baseline.mjs)
          TAG="dsh-v$BASELINE"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "refs/tags/$TAG$"; then
            echo "$TAG already exists, skipping."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
            echo "Tagged $TAG at $GITHUB_SHA"
          fi
