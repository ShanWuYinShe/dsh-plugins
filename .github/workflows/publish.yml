name: Publish to GitHub Releases

on:
  push:
    # tag 驱动发版：只有用户明确打出 `<目录>-v<版本>` 并推出去，才会发版。
    # 分支推送只跑测试（test.yml），永远不发布；CI 也绝不创建任何 tag。
    # 分支模型与发布规则见 RELEASING.md。
    tags:
      - '*-v*'
  # 不监听 release.published：本 workflow 只消费用户已推的 tag，不会自己建
  # release 事件源，不存在自触发循环。发布只由 tag 推送驱动。
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的发布 tag（如 dsh-any-connect-v0.3.19-alpha.2），用于重跑失败的发布或补传资产'
        required: true
        type: string

# 仓库级并发组（不按 tag 区分）：排队发布，不取消进行中的发布——
# 已开始的发布让它跑完，排队的用最新代码重来。
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-24.04
    permissions:
      # 创建 GitHub Release（含 tarball 资产）。注意：CI 只消费用户已推的
      # tag，从不创建 tag——发版与否完全由用户手里的 tag 决定。
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 全量历史：publish-gate 靠 git tag 判定归档状态，
          # 浅克隆会漏 tag 导致误判。
          fetch-depth: 0
          # tag 推送默认检出该 tag；手动触发则检出指定的 tag。
          ref: ${{ inputs.tag || github.ref }}

      # bun 是唯一的包管理器入口:install / test / pack 全走 bun。
      # bun 版本从根 package.json 的 packageManager 字段读取，单一来源。
      # bun-version-file 支持 package.json：2026-09-22 查证 oven-sh/setup-bun
      # 的 action.yml 与 v2 tag 源码（读 packageManager 的 bun@<版本>，回退
      # engines.bun）。
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # setup-node 只提供 Node(下面的 `node -e` 与 scripts/*.mjs 直接调用)。
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test:ci

      # 稳定性回归（AGENTS.md「测试必须确定性」）：多轮全量 + 并发档位，
      # 防止把偶发假红/时序竞态带进 release；脚本见 scripts/test-stability.mjs。
      - name: Test stability
        run: bun run test:stability

      # 发布基线门禁:所有 dsh-* 依赖必须是 ^<版本> 形态、基线与 engines.dsh
      # 兼容声明都齐全且彼此一致——发布归档的 tag 不允许带糊的状态
      # (engines.dsh 是 DSH 官方 manifest 字段,宿主安装/启动据此判定兼容性;
      # 漂移/缺失此前只由每日 cron 的 follow-status 非阻塞告警兜着)。
      # 规则见 scripts/dsh-baseline.mjs。
      - name: Verify dsh baseline
        run: node scripts/dsh-baseline.mjs

      # 依赖漏洞审计（OSV.dev 公共 API，无需认证）：命中已知漏洞 exit 1 阻断
      # 发布；网络不可达 exit 2 同样阻断——发布时网络异常应停下来排查或重试，
      # 不带病发版。规则见 scripts/audit-deps.mjs。
      - name: Audit dependencies
        run: bun run audit

      # 解析本次要发的 tag：tag 推送取 ref 名，手动触发取输入。
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if [ -z "$TAG" ]; then
            echo "未能解析 tag（既非 tag 推送也非手动指定），失败。"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # 门禁只校验该 tag 对应的包：tag 形态合法、tag 与该提交的 package.json
      # 版本一致、版本不落后于已归档。`dsh-v*` 归档 tag 与非发布 tag 输出空
      # 计划直接跳过（判定规则见 scripts/publish-gate.mjs 头注释）。
      - name: Plan publish
        id: plan
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          PLAN=$(node scripts/publish-gate.mjs --tag "$TAG")
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"

      # 发布 = 每个待发布包 bun pm pack 出标准 npm tarball（与原 npm registry
      # 产物同格式：lib/、client/、cordis.patch.yml、engines.dsh 等字段齐全，
      # dsh 的 plugin add 可直接装 tarball URL），作为 GitHub
      # Release 资产上传。tag 由用户明确打出并推出，CI 绝不创建 tag——
      # gh release create 只建 Release 不建 tag；prerelease 布尔取自门禁计划
      # （版本带 `-` 即 true）。消费者安装命令见各包 README。
      - name: Pack and publish planned packages
        id: publish
        if: steps.plan.outputs.plan != '[]'
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PUBLISHED=""
          while IFS= read -r entry; do
            dir="${entry%%@*}"; rest="${entry#*@}"; version="${rest%%@*}"; prerelease="${rest#*@}"
            TAG="$dir-v$version"
            echo "Packing packages/$dir@$version → GitHub Release $TAG (prerelease=$prerelease) ..."
            cd "packages/$dir"
            TARBALL=$(bun pm pack --quiet | tail -1)
            if [ ! -f "$TARBALL" ]; then
              echo "bun pm pack 未能产出预期的 tarball（得到: $TARBALL）"
              exit 1
            fi
            PKG_NAME=$(node -e "console.log(require('./package.json').name)")
            cd ../..
            NOTES=$(node scripts/release-notes.mjs "$dir" "$version")
            PRERELEASE_FLAG=""
            [ "$prerelease" = "true" ] && PRERELEASE_FLAG="--prerelease"
            if gh release view "$TAG" >/dev/null 2>&1; then
              # 重跑幂等：Release 已在（上次运行发布步骤中途失败），只补缺失
              # 的资产；资产也在才整体跳过。
              if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$TARBALL"; then
                echo "Release $TAG 与资产均已存在，跳过。"
              else
                gh release upload "$TAG" "packages/$dir/$TARBALL" --clobber
                echo "Release $TAG 已存在，补传资产 $TARBALL。"
              fi
            else
              gh release create "$TAG" "packages/$dir/$TARBALL" \
                --title "$PKG_NAME v$version" --notes "$NOTES" $PRERELEASE_FLAG
            fi
            PUBLISHED="$PUBLISHED $dir@$version"
          done < <(node -e 'for (const p of JSON.parse(process.argv[1])) console.log(`${p.dir}@${p.version}@${p.prerelease}`)' "$PLAN")
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"

      # ── 插件市场：索引 + 静态 npm registry（独立发布产物分支 market）────────────
      # 每次发布后把「GitHub Releases 里已适配各宿主线的版本」汇总成站点，提交到长期存在的
      # 发布产物分支 market；该分支根目录就是站点根，raw URL 以它为 ref，永久固定：
      #   index:    https://raw.githubusercontent.com/<repo>/market/index.json
      #   registry: https://raw.githubusercontent.com/<repo>/market/npm/
      # 它与 alpha/main 双分支发布体系正交：任一条线（alpha / rc / 正式版）发版都更新同一个
      # 站点，索引源 URL 不随发行分支切换，收敛期删除 alpha 也不影响已添加索引的用户。
      # 生成器只下载并读取 tarball，不安装也不执行包代码；输出确定性，同一批 Releases
      # 重复构建逐字节相同。只有本次真的发布了新版本才生成；workflow_dispatch 无新发布
      # 也重新生成（回填/修复用：填一个已发布的 tag，发布步骤会因已归档跳过）。
      - name: Cache plugin market tarballs
        if: steps.plan.outputs.plan != '[]' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: .workwork/plugin-market-cache
          key: plugin-market-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            plugin-market-${{ github.repository }}-

      - name: Fetch previous market site
        if: steps.plan.outputs.plan != '[]' || github.event_name == 'workflow_dispatch'
        env:
          MARKET_BRANCH: market
        run: |
          set -euo pipefail
          mkdir -p .workwork/plugin-market-previous
          if git fetch --depth=1 origin "$MARKET_BRANCH" >/dev/null 2>&1 && git cat-file -e "FETCH_HEAD:index.json" 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C .workwork/plugin-market-previous
            echo "已取到 $MARKET_BRANCH 分支既有站点，本次只下载新增版本的 tarball。"
          else
            echo "$MARKET_BRANCH 分支还没有站点，本次全量生成。"
          fi

      - name: Generate plugin market site
        if: steps.plan.outputs.plan != '[]' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/market
        run: |
          node scripts/plugin-market.mjs build --out .workwork/plugin-market-commit --previous .workwork/plugin-market-previous --base-url "$BASE_URL" --registry-url "$BASE_URL/npm/"

      - name: Check plugin market site
        if: steps.plan.outputs.plan != '[]' || github.event_name == 'workflow_dispatch'
        env:
          BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/market
        run: |
          node scripts/plugin-market.mjs check --out .workwork/plugin-market-commit --base-url "$BASE_URL" --registry-url "$BASE_URL/npm/"

      # 用临时 worktree 构造提交并推送到独立的发布产物分支 market（分支根即站点根）：
      # 首次没有该分支时创建孤立的根提交，之后在其上累积提交。站点树无变化则跳过（幂等）；
      # 并发推送导致 non-fast-forward 时重新 fetch 最新头、重新生成提交再推，至多重试 3 次。
      # 用 GITHUB_TOKEN 推送不会触发其它 workflow（GitHub 对 token 事件的限制），
      # 站点更新因此不会产生测试或发布流水。
      - name: Publish market branch
        if: steps.plan.outputs.plan != '[]' || github.event_name == 'workflow_dispatch'
        env:
          MARKET_BRANCH: market
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          SITE="$PWD/.workwork/plugin-market-commit"
          # 身份用 `git -c` 逐命令传，**不要 git config 写仓库配置**：本步骤也会
          # 在本地手动回填市场时执行，写仓库级 config 会把之后人工提交/tag 的作者
          # 改成交互机器人（已踩过：本地回填后 alpha 的提交与发版 tag 全成 bot）。
          AUTHOR=(-c "user.name=github-actions[bot]" -c "user.email=41898282+github-actions[bot]@users.noreply.github.com")
          WORKTREE="$(mktemp -d)/checkout"
          for attempt in 1 2 3; do
            echo "== 尝试 $attempt/3：提交到 $MARKET_BRANCH 分支 =="
            rm -rf "$WORKTREE"
            git worktree prune >/dev/null 2>&1 || true
            if git fetch --depth=1 origin "$MARKET_BRANCH" >/dev/null 2>&1; then
              PARENT=$(git rev-parse FETCH_HEAD)
              git worktree add --detach --force "$WORKTREE" "$PARENT" >/dev/null 2>&1
              rm -rf "$WORKTREE/index.json" "$WORKTREE/README.md" "$WORKTREE/icons" "$WORKTREE/npm"
            else
              # 首次：在孤立根提交上建站（分支根即站点根）。
              PARENT=""
              git worktree add --detach --force "$WORKTREE" HEAD >/dev/null 2>&1
              git -C "$WORKTREE" rm -r -f -q . >/dev/null 2>&1 || true
            fi
            cp -R "$SITE"/. "$WORKTREE"/
            git -C "$WORKTREE" add -A
            if [ -n "$PARENT" ] && git -C "$WORKTREE" diff-index --cached --quiet "$PARENT"; then
              echo "站点内容无变化，跳过提交。"
              git worktree remove --force "$WORKTREE" >/dev/null 2>&1 || true
              exit 0
            fi
            TREE=$(git -C "$WORKTREE" write-tree)
            if [ -n "$PARENT" ]; then
              COMMIT=$(git -C "$WORKTREE" "${AUTHOR[@]}" commit-tree "$TREE" -p "$PARENT" -m "市场: 更新插件索引与静态 registry（$TAG）")
            else
              COMMIT=$(git -C "$WORKTREE" "${AUTHOR[@]}" commit-tree "$TREE" -m "市场: 初始化插件索引与静态 registry")
            fi
            git worktree remove --force "$WORKTREE" >/dev/null 2>&1 || true
            if git push origin "$COMMIT:refs/heads/$MARKET_BRANCH"; then
              echo "已推送 $MARKET_BRANCH 分支：$COMMIT"
              exit 0
            fi
            echo "推送被拒绝（可能远端并发更新），重取 $MARKET_BRANCH 最新头后重试…"
            sleep 3
          done
          echo "::error::market 分支推送重试 3 次仍失败"
          exit 1
