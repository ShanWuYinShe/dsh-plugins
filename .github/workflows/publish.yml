name: Publish to GitHub Releases

on:
  push:
    # tag 驱动发版：只有用户明确打出 `<目录>-v<版本>` 并推出去，才会发版。
    # 分支推送只跑测试（test.yml），永远不发布；CI 也绝不创建任何 tag。
    # 分支模型与发布规则见 RELEASING.md。
    tags:
      - '*-v*'
  # 不监听 release.published：本 workflow 只消费用户已推的 tag，不会自己建
  # release 事件源，不存在自触发循环。发布只由 tag 推送驱动。
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的发布 tag（如 dsh-any-connect-v0.3.19-alpha.2），用于重跑失败的发布或补传资产'
        required: true
        type: string

# 仓库级并发组（不按 tag 区分）：排队发布，不取消进行中的发布——
# 已开始的发布让它跑完，排队的用最新代码重来。
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-24.04
    permissions:
      # 创建 GitHub Release（含 tarball 资产）。注意：CI 只消费用户已推的
      # tag，从不创建 tag——发版与否完全由用户手里的 tag 决定。
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 全量历史：publish-gate 靠 git tag 判定归档状态，
          # 浅克隆会漏 tag 导致误判。
          fetch-depth: 0
          # tag 推送默认检出该 tag；手动触发则检出指定的 tag。
          ref: ${{ inputs.tag || github.ref }}

      # bun 是唯一的包管理器入口:install / test / pack 全走 bun。
      # bun 版本从根 package.json 的 packageManager 字段读取，单一来源。
      # bun-version-file 支持 package.json：2026-09-22 查证 oven-sh/setup-bun
      # 的 action.yml 与 v2 tag 源码（读 packageManager 的 bun@<版本>，回退
      # engines.bun）。
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # setup-node 只提供 Node(下面的 `node -e` 与 scripts/*.mjs 直接调用)。
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test:ci

      # 发布基线门禁:所有 dsh-* 依赖必须是 ^<版本> 形态、基线与 engines.dsh
      # 兼容声明都齐全且彼此一致——发布归档的 tag 不允许带糊的状态
      # (engines.dsh 是 DSH 官方 manifest 字段,宿主安装/启动据此判定兼容性;
      # 漂移/缺失此前只由每日 cron 的 follow-status 非阻塞告警兜着)。
      # 规则见 scripts/dsh-baseline.mjs。
      - name: Verify dsh baseline
        run: node scripts/dsh-baseline.mjs

      # 依赖漏洞审计（OSV.dev 公共 API，无需认证）：命中已知漏洞 exit 1 阻断
      # 发布；网络不可达 exit 2 同样阻断——发布时网络异常应停下来排查或重试，
      # 不带病发版。规则见 scripts/audit-deps.mjs。
      - name: Audit dependencies
        run: bun run audit

      # 解析本次要发的 tag：tag 推送取 ref 名，手动触发取输入。
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if [ -z "$TAG" ]; then
            echo "未能解析 tag（既非 tag 推送也非手动指定），失败。"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # 门禁只校验该 tag 对应的包：tag 形态合法、tag 与该提交的 package.json
      # 版本一致、版本不落后于已归档。`dsh-v*` 归档 tag 与非发布 tag 输出空
      # 计划直接跳过（判定规则见 scripts/publish-gate.mjs 头注释）。
      - name: Plan publish
        id: plan
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          PLAN=$(node scripts/publish-gate.mjs --tag "$TAG")
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"

      # 发布 = 每个待发布包 bun pm pack 出标准 npm tarball（与原 npm registry
      # 产物同格式：lib/、client/、cordis.patch.yml、engines.dsh 等字段齐全，
      # dsh 的 plugin add 可直接装 tarball URL），作为 GitHub
      # Release 资产上传。tag 由用户明确打出并推出，CI 绝不创建 tag——
      # gh release create 只建 Release 不建 tag；prerelease 布尔取自门禁计划
      # （版本带 `-` 即 true）。消费者安装命令见各包 README。
      - name: Pack and publish planned packages
        id: publish
        if: steps.plan.outputs.plan != '[]'
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PUBLISHED=""
          while IFS= read -r entry; do
            dir="${entry%%@*}"; rest="${entry#*@}"; version="${rest%%@*}"; prerelease="${rest#*@}"
            TAG="$dir-v$version"
            echo "Packing packages/$dir@$version → GitHub Release $TAG (prerelease=$prerelease) ..."
            cd "packages/$dir"
            TARBALL=$(bun pm pack --quiet | tail -1)
            if [ ! -f "$TARBALL" ]; then
              echo "bun pm pack 未能产出预期的 tarball（得到: $TARBALL）"
              exit 1
            fi
            PKG_NAME=$(node -e "console.log(require('./package.json').name)")
            cd ../..
            NOTES=$(node scripts/release-notes.mjs "$dir" "$version")
            PRERELEASE_FLAG=""
            [ "$prerelease" = "true" ] && PRERELEASE_FLAG="--prerelease"
            if gh release view "$TAG" >/dev/null 2>&1; then
              # 重跑幂等：Release 已在（上次运行发布步骤中途失败），只补缺失
              # 的资产；资产也在才整体跳过。
              if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$TARBALL"; then
                echo "Release $TAG 与资产均已存在，跳过。"
              else
                gh release upload "$TAG" "packages/$dir/$TARBALL" --clobber
                echo "Release $TAG 已存在，补传资产 $TARBALL。"
              fi
            else
              gh release create "$TAG" "packages/$dir/$TARBALL" \
                --title "$PKG_NAME v$version" --notes "$NOTES" $PRERELEASE_FLAG
            fi
            PUBLISHED="$PUBLISHED $dir@$version"
          done < <(node -e 'for (const p of JSON.parse(process.argv[1])) console.log(`${p.dir}@${p.version}@${p.prerelease}`)' "$PLAN")
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"

      # ── 插件市场：索引 + 静态 npm registry（发行分支根的 market/ 目录）────────────
      # 每次发布后把「GitHub Releases 里已适配各宿主线的版本」汇总成站点，提交到 tag 所在
      # 发行分支（alpha，收敛后 main）根下的 market/ 目录；raw URL 以该分支为 ref：
      #   index:    https://raw.githubusercontent.com/<repo>/<ref>/market/index.json
      #   registry: https://raw.githubusercontent.com/<repo>/<ref>/market/npm/
      # 生成器只下载并读取 tarball，不安装也不执行包代码；输出确定性，同一批 Releases
      # 重复构建逐字节相同。只有本次真的发布了新版本才生成；workflow_dispatch 无新发布
      # 也重新生成（回填/修复用：填一个已发布的 tag，发布步骤会因已归档跳过）。
      - name: Resolve market target ref
        id: market-target
        if: steps.plan.outputs.plan != '[]' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          # tag 触发时 github.ref_name 是 tag 名（不是分支名），因此找包含该 tag 提交的发行分支。
          # HEAD 即 checkout 检出的触发 tag（workflow_dispatch 时是 tag 输入），用它做归属判断。
          TARGET="$(git rev-parse HEAD)"
          # main 优先：收敛后/待命期的 tag 属于 main；适配期的 tag 只存在于 alpha（main 被搁置，
          # 不含 alpha 的提交），因此按 main -> alpha 匹配既能保证站点留在长期分支，也不会在
          # 适配期误推 main。
          for candidate in main alpha; do
            git fetch --no-tags origin "+refs/heads/$candidate:refs/remotes/origin/$candidate" >/dev/null 2>&1 || true
          done
          REF=""
          for candidate in main alpha; do
            if ! git rev-parse --verify --quiet "refs/remotes/origin/$candidate" >/dev/null 2>&1; then
              continue
            fi
            if git merge-base --is-ancestor "$TARGET" "refs/remotes/origin/$candidate" || [ "$TARGET" = "$(git rev-parse "refs/remotes/origin/$candidate")" ]; then
              REF="$candidate"
              break
            fi
          done
          if [ -z "$REF" ]; then
            echo "::error::$GITHUB_REF_NAME 不属于 alpha/main，无法确定站点提交目标分支"
            exit 1
          fi
          BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${REF}/market"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "base_url=$BASE" >> "$GITHUB_OUTPUT"
          echo "站点目标：分支 $REF 的 market/（$BASE）"

      - name: Cache plugin market tarballs
        if: steps.plan.outputs.plan != '[]' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: .workwork/plugin-market-cache
          key: plugin-market-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            plugin-market-${{ github.repository }}-

      - name: Fetch previous market dir
        if: steps.plan.outputs.plan != '[]' || github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ steps.market-target.outputs.ref }}
        run: |
          set -euo pipefail
          mkdir -p .workwork/plugin-market-previous
          if git fetch --depth=1 origin "$REF" >/dev/null 2>&1 && git cat-file -e "FETCH_HEAD:market" 2>/dev/null; then
            git archive FETCH_HEAD market | tar -x -C .workwork/plugin-market-previous
            echo "已取到 $REF 分支既有 market/ 站点，本次只下载新增版本的 tarball。"
          else
            echo "$REF 分支还没有 market/ 目录，本次全量生成。"
          fi

      - name: Generate plugin market site
        if: steps.plan.outputs.plan != '[]' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_URL: ${{ steps.market-target.outputs.base_url }}
        run: |
          node scripts/plugin-market.mjs build --out .workwork/plugin-market-commit/market --previous .workwork/plugin-market-previous/market --base-url "$BASE_URL" --registry-url "$BASE_URL/npm/"

      - name: Check plugin market site
        if: steps.plan.outputs.plan != '[]' || github.event_name == 'workflow_dispatch'
        env:
          BASE_URL: ${{ steps.market-target.outputs.base_url }}
        run: |
          node scripts/plugin-market.mjs check --out .workwork/plugin-market-commit/market --base-url "$BASE_URL" --registry-url "$BASE_URL/npm/"

      # 用临时 worktree 检出目标分支当前头，把站点写入 market/ 后提交并推送：
      # 只提交 market/ 子树的变化（树不变则跳过，幂等）；并发推送导致 non-fast-forward 时
      # 重新 fetch 最新头、重新生成提交再推，至多重试 3 次。
      - name: Publish market directory
        if: steps.plan.outputs.plan != '[]' || github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ steps.market-target.outputs.ref }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          SITE="$PWD/.workwork/plugin-market-commit/market"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WORKTREE="$(mktemp -d)/checkout"
          for attempt in 1 2 3; do
            echo "== 尝试 $attempt/3：提交到 $REF 的 market/ =="
            rm -rf "$WORKTREE"
            git fetch --depth=1 origin "$REF"
            PARENT=$(git rev-parse FETCH_HEAD)
            git worktree add --detach --force "$WORKTREE" "$PARENT" >/dev/null 2>&1
            rm -rf "$WORKTREE/market"
            cp -R "$SITE" "$WORKTREE/market"
            git -C "$WORKTREE" add -A -- market
            if git -C "$WORKTREE" diff-index --cached --quiet "$PARENT" -- market; then
              echo "market/ 内容无变化，跳过提交。"
              git worktree remove --force "$WORKTREE" >/dev/null 2>&1 || true
              exit 0
            fi
            TREE=$(git -C "$WORKTREE" write-tree)
            COMMIT=$(git -C "$WORKTREE" commit-tree "$TREE" -p "$PARENT" -m "市场: 更新插件索引与静态 registry（$TAG）")
            git worktree remove --force "$WORKTREE" >/dev/null 2>&1 || true
            if git push origin "$COMMIT:refs/heads/$REF"; then
              echo "已推送 $REF 分支的 market/ 目录：$COMMIT"
              exit 0
            fi
            echo "推送被拒绝（可能远端并发更新），重取 $REF 最新头后重试…"
            sleep 3
          done
          echo "::error::market/ 目录推送重试 3 次仍失败"
          exit 1
