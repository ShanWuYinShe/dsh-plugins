name: Test

# PR 校验：推送 main / alpha 的测试由发布工作流顺带完成，这里只补 PR 这一环
# （此前对 main/alpha 的 PR 不会触发任何测试）。
on:
  pull_request:
    branches:
      - main
      - alpha
    paths:
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - 'scripts/**'
      - '.github/workflows/*'

# 同一 PR 连续推送时取消旧的测试，只跑最新代码。
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # bun 是唯一的包管理器入口：install / test / pack 全走 bun。
      # bun 版本与根 package.json 的 packageManager 字段保持一致。
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # setup-node 只提供 node 二进制（scripts/*.mjs 直接用 node 调用），
      # 不再做任何包管理器的缓存。
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and test
        run: bun run test:ci
