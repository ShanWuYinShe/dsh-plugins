# @chaoset/dsh-any-connect bundle patch
#
# Installed automatically by:
#   dsh plugin --profile <name> add @chaoset/dsh-any-connect
#
# This patch inserts the host plugin row with the default configuration. The
# plugin reads WorkBuddy desktop credentials from the app's own location, so
# an empty config is the normal case; set `authFile` to point at a specific
# credential file.

- insert:
    - id: dsh-any-connect
      name: '@chaoset/dsh-any-connect'
      config:
        authFile: ''
